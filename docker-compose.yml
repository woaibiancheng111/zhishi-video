version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16
    container_name: zhishi-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhishi2026}
      POSTGRES_DB: ${POSTGRES_DB:-zhishi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zhishi-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: zhishi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zhishi-network

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhishi-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-zhishi2026}@postgres:5432/${POSTGRES_DB:-zhishi}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-zhishi-jwt-secret-2026}
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    networks:
      - zhishi-network

  # AI 推荐服务
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: zhishi-ai-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-zhishi2026}@postgres:5432/${POSTGRES_DB:-zhishi}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ai-service/app:/app/app
    networks:
      - zhishi-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhishi-frontend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - zhishi-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: zhishi-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - ai-service
    networks:
      - zhishi-network

volumes:
  postgres_data:
  redis_data:

networks:
  zhishi-network:
    driver: bridge
